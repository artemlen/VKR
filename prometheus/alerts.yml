groups:
  - name: bank.infrastructure.critical
    interval: 5s
    rules:

      # ── CPU ──────────────────────────────────────────────────────
      - alert: HighCPUUsage
        expr: |
          100 - (avg by(instance, location, datacenter)
            (rate(node_cpu_seconds_total{mode="idle"}[2m])) * 100) > 60
        for: 10s
        labels:
          severity: critical
          category: cpu
          team: infrastructure
        annotations:
          summary: "Высокая нагрузка CPU на {{ $labels.instance }}"
          description: >
            Сервер {{ $labels.instance }} ({{ $labels.datacenter }})
            испытывает нагрузку CPU {{ printf "%.1f" $value }}%.
            Порог: 80%. Требуется немедленное внимание.
          runbook: "https://wiki.bank.ru/runbooks/high-cpu"

      - alert: CriticalCPUUsage
        expr: |
          100 - (avg by(instance, location, datacenter)
            (rate(node_cpu_seconds_total{mode="idle"}[2m])) * 100) > 80
        for: 5s
        labels:
          severity: critical
          category: cpu
          team: infrastructure
          priority: P1
        annotations:
          summary: "КРИТИЧНО: CPU > 95% на {{ $labels.instance }}"
          description: >
            КРИТИЧЕСКАЯ СИТУАЦИЯ! Сервер {{ $labels.instance }}
            ({{ $labels.datacenter }}) перегружен: CPU = {{ printf "%.1f" $value }}%.

      # ── Memory ───────────────────────────────────────────────────
      - alert: HighMemoryUsage
        expr: |
          (1 - (node_memory_MemAvailable_bytes /
                node_memory_MemTotal_bytes)) * 100 > 80
        for: 2m
        labels:
          severity: warning
          category: memory
          team: infrastructure
        annotations:
          summary: "Высокое потребление памяти на {{ $labels.instance }}"
          description: >
            Сервер {{ $labels.instance }} ({{ $labels.datacenter }})
            использует {{ printf "%.1f" $value }}% RAM.
            Порог: 80%.

      - alert: CriticalMemoryUsage
        expr: |
          (1 - (node_memory_MemAvailable_bytes /
                node_memory_MemTotal_bytes)) * 100 > 95
        for: 1m
        labels:
          severity: critical
          category: memory
          team: infrastructure
          priority: P1
        annotations:
          summary: "КРИТИЧНО: Memory > 95% на {{ $labels.instance }}"
          description: >
            КРИТИЧЕСКАЯ СИТУАЦИЯ! Сервер {{ $labels.instance }}
            использует {{ printf "%.1f" $value }}% RAM.

      # ── Load Average ─────────────────────────────────────────────
      #- alert: HighLoadAverage
      #  expr: node_load1 > 2
      #  for: 2m
      #  labels:
      #    severity: warning
      #    category: load
      #    team: infrastructure
      #  annotations:
      #    summary: "Высокий Load Average на {{ $labels.instance }}"
      #    description: >
      #      Load Average (1m) на {{ $labels.instance }}: {{ printf "%.2f" $value }}.
      #      Порог: 2.0.

      # ── Disk ─────────────────────────────────────────────────────
      - alert: DiskSpaceWarning
        expr: |
          (1 - (node_filesystem_avail_bytes{fstype!~"tmpfs|overlay|proc"} /
                node_filesystem_size_bytes{fstype!~"tmpfs|overlay|proc"})) * 100 > 70
        for: 5m
        labels:
          severity: warning
          category: disk
          team: infrastructure
        annotations:
          summary: "Диск заполнен на {{ printf \"%.0f\" $value }}% ({{ $labels.instance }})"
          description: >
            Раздел {{ $labels.mountpoint }} на {{ $labels.instance }}
            заполнен на {{ printf "%.1f" $value }}%. Порог: 70%.

      # ── Node Down ─────────────────────────────────────────────────
      - alert: NodeDown
        expr: up{job=~"server-.*"} == 0
        for: 30s
        labels:
          severity: critical
          category: availability
          team: infrastructure
          priority: P1
        annotations:
          summary: "СЕРВЕР НЕДОСТУПЕН: {{ $labels.instance }}"
          description: >
            Сервер {{ $labels.instance }} не отвечает более 30 секунд!
            Проверьте состояние хоста.

  - name: bank.infrastructure.warnings
    interval: 60s
    rules:

      - alert: CPUUsageWarning
        expr: |
          100 - (avg by(instance, location, datacenter)
            (rate(node_cpu_seconds_total{mode="idle"}[5m])) * 100) > 40
        for: 3m
        labels:
          severity: warning
          category: cpu
          team: infrastructure
        annotations:
          summary: "Повышенная нагрузка CPU на {{ $labels.instance }}"
          description: >
            CPU на {{ $labels.instance }} составляет {{ printf "%.1f" $value }}%.
            Рекомендуется проверить запущенные процессы.