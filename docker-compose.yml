version: '3.8'

services:
  # 1. Симулируемый удаленный сервер СПб
  spb:
    build: ./spb
    container_name: server-spb
    restart: unless-stopped
    networks:
      - bank_net

  # 2. Сбор метрик
  prometheus:
    image: prom/prometheus:latest
    container_name: prometheus
    restart: unless-stopped
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml
      - ./prometheus/alert_rules.yml:/etc/prometheus/alert_rules.yml
    networks:
      - bank_net

  # 3. Маршрутизация алертов
  alertmanager:
    image: prom/alertmanager:latest
    container_name: alertmanager
    restart: unless-stopped
    ports:
      - "9093:9093"
    volumes:
      - ./alertmanager/alertmanager.yml:/etc/alertmanager/alertmanager.yml
    networks:
      - bank_net

  # 4. Твой Middleware (фильтрация шума)
  middleware:
    build: ./middleware
    container_name: smart-middleware
    restart: unless-stopped
    ports:
      - "8000:8000"
    env_file:
      - .env
    networks:
      - bank_net

  # 5. Сервер уведомлений
  gotify:
    image: gotify/server:latest
    container_name: gotify
    restart: unless-stopped
    ports:
      - "8090:8080"
    environment:
      GOTIFY_SERVER_PORT: "8080"
    volumes:
      - gotify_data:/app
    networks:
      - bank_net

  # 6. Визуализация
  grafana:
    image: grafana/grafana:latest
    container_name: grafana
    restart: unless-stopped
    ports:
      - "3000:3000"
    networks:
      - bank_net

networks:
  bank_net:
    driver: bridge

volumes:
  gotify_data: