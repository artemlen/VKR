global:
  resolve_timeout: 5m

route:
  group_by: ["alertname", "instance", "severity"]
  group_wait: 10s
  group_interval: 30s
  repeat_interval: 5m
  receiver: "middleware"

  routes:
    # P1 - критические алерты идут сразу
    - match:
        priority: P1
      receiver: "middleware"
      group_wait: 5s
      repeat_interval: 2m

    # warning - с небольшой задержкой
    - match:
        severity: warning
      receiver: "middleware"
      group_wait: 30s
      repeat_interval: 10m

receivers:
  - name: "middleware"
    webhook_configs:
      - url: "http://middleware:8081/webhook"
        send_resolved: true
        http_config:
          timeout: 10s

inhibit_rules:
  # Если нода упала - подавляем остальные алерты с этой ноды
  - source_match:
      alertname: NodeDown
    target_match_re:
      alertname: "HighCPUUsage|CriticalCPUUsage|HighMemoryUsage|CriticalMemoryUsage"
    equal: ["instance"]

  # Critical подавляет warning того же типа
  - source_match:
      severity: critical
    target_match:
      severity: warning
    equal: ["alertname", "instance"]